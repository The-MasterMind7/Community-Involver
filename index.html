
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Element Recommender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Welcome to the Interactive Recommender!</h1>

    <div id="elements-selection">
        <h2>Elements to Select</h2>
        <!-- Elements will be dynamically loaded here by JavaScript -->
    </div>

    <div id="recommended-elements">
        <h2>Recommended Elements</h2>
        <!-- Recommendations will be displayed here by JavaScript -->
    </div>

    <div id="friend-suggestions">
        <h2>Friend Suggestions</h2>
        <!-- Friend suggestions will be displayed here by JavaScript -->
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
